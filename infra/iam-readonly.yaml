AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only policy and assumable role (cannot be deployed in the AWS Academy sandbox)

Resources:
  ReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: kv-readonly
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMetadataReadsOnly
            Effect: Allow
            Action:
              - 'ec2:Describe*'
              - 's3:ListAllMyBuckets'
              - 's3:GetBucketLocation'
              - 'iam:ListRoles'
              - 'iam:ListPolicies'
              - 'iam:ListAttachedRolePolicies'
              - 'iam:ListRolePolicies'
              - 'iam:GetRole'
              - 'iam:GetPolicy'
              - 'iam:GetPolicyVersion'
              - 'cloudformation:Describe*'
              - 'cloudformation:ListStacks'
              - 'cloudformation:ListStackResources'
              - 'cloudformation:ListExports'
              - 'dynamodb:Describe*'
              - 'dynamodb:ListTables'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:ListMetrics'
              - 'cloudwatch:GetMetricData'
              - 'cloudwatch:GetMetricStatistics'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
            Resource: '*'
          - Sid: DenySensitiveReads
            Effect: Deny
            Action:
              - 'ec2:GetPasswordData'
              - 'ec2:GetConsoleOutput'
              - 'ec2:GetConsoleScreenshot'
              - 'ec2:GetLaunchTemplateData'
              - 'ec2:DescribeInstanceAttribute'
              - 'ec2:DescribeLaunchTemplateVersions'
              - 'lambda:GetFunction*'
              - 'lambda:ListFunctions'
              - 'logs:GetLogEvents'
              - 'logs:FilterLogEvents'
              - 'logs:StartQuery'
              - 'logs:GetQueryResults'
              - 'secretsmanager:GetSecretValue'
              - 'ssm:GetParameter*'
              - 'kms:Decrypt'
              - 's3:GetObject*'
              - 'dynamodb:GetItem'
              - 'dynamodb:BatchGetItem'
              - 'dynamodb:Query'
              - 'dynamodb:Scan'
              - 'cloudformation:GetTemplate*'
            Resource: '*'
          - Sid: DenyAnyWrite
            Effect: Deny
            Action:
              - 'ec2:Create*'
              - 'ec2:Delete*'
              - 'ec2:Modify*'
              - 'ec2:RunInstances'
              - 'ec2:TerminateInstances'
              - 's3:Put*'
              - 's3:Delete*'
              - 'iam:Create*'
              - 'iam:Delete*'
              - 'iam:Put*'
              - 'iam:Attach*'
              - 'cloudformation:Create*'
              - 'cloudformation:Delete*'
              - 'cloudformation:Update*'
              - 'dynamodb:Put*'
              - 'dynamodb:Delete*'
              - 'dynamodb:Update*'
              - 'lambda:Create*'
              - 'lambda:Delete*'
              - 'lambda:Update*'
            Resource: '*'

  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kv-readonly-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ReadOnlyPolicy

Outputs:
  RoleArn:
    Value: !GetAtt ReadOnlyRole.Arn
